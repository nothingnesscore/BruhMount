name: Upstream Sync (NoMount)

on:
  schedule:
    - cron: '0 */6 * * *' # Check every 6 hours
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: "Upstream branch to track"
        required: true
        default: "master"
        type: choice
        options:
          - master
          - dev

permissions:
  contents: write
  actions: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check, Harmonize & Merge Upstream
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ inputs.upstream_branch || 'master' }}
        run: |
          node .github/scripts/sync_upstream.js
