name: Upstream Sync (NoMount)

on:
  schedule:
    - cron: '0 */6 * * *' # Check every 6 hours
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: "Upstream branch to track"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - master

permissions:
  contents: write
  actions: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js (for WebUI validation)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check & Merge Upstream
        id: sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="${{ inputs.upstream_branch || 'dev' }}"
          echo "Tracking upstream branch: $TARGET_BRANCH"

          git remote add upstream https://github.com/maxsteeel/nomount.git || true
          git fetch upstream "$TARGET_BRANCH"

          LOCAL_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHA=$(git rev-parse "upstream/$TARGET_BRANCH")

          echo "Local SHA: $LOCAL_SHA"
          echo "Upstream SHA: $UPSTREAM_SHA"

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "Already up to date with upstream/nomount ($UPSTREAM_SHA)."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New commits detected in upstream nomount!"
          echo "has_updates=true" >> "$GITHUB_OUTPUT"

          # Attempt merge
          if git merge "upstream/$TARGET_BRANCH" -m "chore(upstream): sync with maxsteeel/nomount ($TARGET_BRANCH @ ${UPSTREAM_SHA:0:7})" --no-commit; then
            echo "Clean merge achieved!"
            git commit -m "chore(upstream): sync with maxsteeel/nomount ($TARGET_BRANCH @ ${UPSTREAM_SHA:0:7})"
          else
            echo "Merge conflict detected. Auto-resolving in favor of BruhMount enhancements..."
            git checkout HEAD -- module/metamount.sh module/webroot/index.js module/webroot/index.html module/webroot/theme.css module/webroot/styles.css || true
            git add -A
            git commit -m "chore(upstream): auto-merge maxsteeel/nomount ($TARGET_BRANCH @ ${UPSTREAM_SHA:0:7}) with BruhMount enhancements"
          fi

          # Validate WebUI syntax
          node -c module/webroot/index.js
          echo "WebUI syntax validated successfully."

          # Push changes to trigger build.yml CI automatically
          git push origin master
          echo "Pushed sync commit to master. Continuous CI build will start automatically."
