name: build module

on:
  push:
    branches: [ master, dev ]
    paths-ignore: 
      - '**.md'
      - '**.git*'
      - '**.sh'
  workflow_dispatch:

jobs:
  build-lkm:
    uses: ./.github/workflows/build-lkm.yml
    with:
      build_all: true

  build-module:
    needs: build-lkm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup zig
        uses: jetsung/setup-zig@v0.0.4
        with:
          version: master

      - name: grab sstrip from ELFkickers
        run: |
          curl -L https://www.muppetlabs.com/~breadbox/pub/software/ELFkickers-3.2.tar.gz -o sstrip.tar.gz
          tar xf sstrip.tar.gz
          make -C ELFkickers-3.2 sstrip
          cp ELFkickers-3.2/sstrip/sstrip .
          chmod +x ./sstrip

      - name: compile nm via zigcc
        run: |
          mkdir bin
          cd userspace/src
          zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -nostdlib -ffreestanding -fno-unwind-tables \
            -fno-ident -Wno-invalid-noreturn -Wl,--entry=_start nm.c -o ../../bin/nm-arm64

          zig cc -target arm-linux -Oz -static -nostdlib -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn \
            -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--entry=_start nm.c -o ../../bin/nm-arm

          cd ../../bin
          ../sstrip -z nm-arm64
          ../sstrip -z nm-arm

          file nm-*
          mkdir -p ../module/bin
          mv nm-* ../module/bin/

      
      - name: compile ksu_susfs via zigcc
        run: |
          cd userspace/susfs_src
          zig cc -target aarch64-linux-musl -D_GNU_SOURCE -Oz -static -Iincludes -I. \
            main.c susfs_utils.c features/*.c -o ../../bin/ksu_susfs-arm64
          zig cc -target arm-linux-musleabihf -D_GNU_SOURCE -Oz -static -Iincludes -I. \
            main.c susfs_utils.c features/*.c -o ../../bin/ksu_susfs-arm
          cd ../../bin
          ../sstrip -z ksu_susfs-arm64
          ../sstrip -z ksu_susfs-arm
          file ksu_susfs-*
          mv ksu_susfs-* ../module/bin/

      - name: compile ko-loader via zigcc
        run: |
          git clone https://github.com/maxsteeel/ko-loader.git ko_loader_src
          cd ko_loader_src

          make TARGET=aarch64-linux-musl
          mv ko-loader ko-loader-arm64

          make TARGET=arm-linux-musleabihf
          mv ko-loader ko-loader-arm

          ../sstrip -z ko-loader-arm64
          ../sstrip -z ko-loader-arm

          file ko-loader-*
          mv ko-loader-* ../module/bin/

      - name: Download all LKM artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: nomount-*
          path: module/lkm
          merge-multiple: true

      - name: Process versioning and metadata
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          NAME=$(sed -n 's/^name=//p' module/module.prop | tr -d '\r' | tr -d ' ')
          BASE_VERSION=$(sed -n 's/^version=//p' module/module.prop | tr -d '\r' | tr -d ' ')

          sed -i "s/^versionCode=.*/versionCode=${COMMIT_COUNT}/" module/module.prop
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            sed -i "s/^version=\(.*\)/version=\1 \(${COMMIT_COUNT}-${SHORT_HASH}-dev\)/" module/module.prop
            echo "ARTIFACT_NAME=${NAME}-${BASE_VERSION}-dev-${SHORT_HASH}-${COMMIT_COUNT}" >> $GITHUB_ENV
          else
            sed -i "s/^version=\(.*\)/version=\1 \(${COMMIT_COUNT}\)/" module/module.prop
            echo "ARTIFACT_NAME=${NAME}-${BASE_VERSION}-release-${SHORT_HASH}-${COMMIT_COUNT}" >> $GITHUB_ENV
          fi

      - name: Optimize release module (via standalone esbuild)
        run: |
          MODULE_BUILD="$RUNNER_TEMP/nomount-module-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          WEBUI_BUILD="$RUNNER_TEMP/nomount-webui-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          cp -a module "$MODULE_BUILD"
          for f in "$MODULE_BUILD"/webroot/locales/*.json; do jq -c . "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
          mkdir -p "$WEBUI_BUILD"
          sed '/@import ".\/theme.css";/d' module/webroot/styles.css > "$WEBUI_BUILD/temp.css"
          cat "$WEBUI_BUILD/temp.css" module/webroot/theme.css > "$WEBUI_BUILD/combined.css"

          curl -sL "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.28.1.tgz" -o /tmp/esbuild.tgz
          tar -xzf /tmp/esbuild.tgz -C /tmp && mv /tmp/package/bin/esbuild /tmp/esbuild && chmod +x /tmp/esbuild
          /tmp/esbuild module/webroot/index.js --bundle --format=esm --minify --outfile="$WEBUI_BUILD/index.js"
          /tmp/esbuild "$WEBUI_BUILD/combined.css" --minify --outfile="$WEBUI_BUILD/styles.css"
          tr '\n' ' ' < module/webroot/index.html | sed 's/  */ /g' | sed 's/> </></g' > "$WEBUI_BUILD/index.html"

          install -m 0644 "$WEBUI_BUILD/index.js" "$MODULE_BUILD/webroot/index.js"
          install -m 0644 "$WEBUI_BUILD/styles.css" "$MODULE_BUILD/webroot/styles.css"
          install -m 0644 "$WEBUI_BUILD/index.html" "$MODULE_BUILD/webroot/index.html"

          rm "$MODULE_BUILD/webroot/theme.css"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/nomount-module-${{ github.run_id }}-${{ github.run_attempt }}/

      - name: Package flashable module ZIP
        run: |
          MODULE_BUILD="$RUNNER_TEMP/nomount-module-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ZIP_FILE="$RUNNER_TEMP/${ARTIFACT_NAME}.zip"
          command -v zip >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y zip)
          cd "$MODULE_BUILD"
          zip -r9 "$ZIP_FILE" .
          echo "MODULE_ZIP=$ZIP_FILE" >> $GITHUB_ENV
          echo "ZIP_NAME=${ARTIFACT_NAME}.zip" >> $GITHUB_ENV
          echo "[+] Flashable module ZIP created: $ZIP_FILE ($(du -h "$ZIP_FILE" | cut -f1))"

      - name: Upload module ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-zip
          path: ${{ env.MODULE_ZIP }}

      - name: Upload module to Telegram (@bruhperidot)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@bruhperidot' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::notice title=Telegram Upload Notice::TELEGRAM_BOT_TOKEN is not configured in repository secrets. Module ZIP was built successfully."
            echo "To enable automatic module uploads to https://t.me/bruhperidot:"
            echo "  1. Open Telegram and message @BotFather to create a bot (/newbot)."
            echo "  2. Copy the HTTP API token provided by BotFather."
            echo "  3. Add the bot to your channel (https://t.me/bruhperidot) as an Administrator with 'Post Messages' permission."
            echo "  4. In GitHub -> BruhMount repo -> Settings -> Secrets and variables -> Actions -> New repository secret:"
            echo "     Name: TELEGRAM_BOT_TOKEN"
            echo "     Value: <your bot token>"
            exit 0
          fi

          echo "[+] Generating monospace changelog caption..."
          SHORT_HASH=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION=$(sed -n 's/^version=//p' module/module.prop | tr -d '\r')
          BRANCH="${GITHUB_REF_NAME:-master}"

          COMMITS=$(git log --no-merges -n 5 --pretty=format:"• %s (%h)" 2>/dev/null || git log -n 5 --pretty=format:"• %s (%h)")

          export RAW_CAPTION=$(cat << EOF
📦 BruhMount Flashable Module
──────────────────────────────
Version : ${VERSION}
Branch  : ${BRANCH}
Commit  : ${SHORT_HASH}
Target  : KernelSU / APatch

Changelog:
${COMMITS}
──────────────────────────────
EOF
)

          python3 - << 'PYEOF'
import html
import os

raw = os.environ.get("RAW_CAPTION", "")
if len(raw) > 950:
    raw = raw[:947] + "..."

escaped = html.escape(raw)
formatted = f"<pre><code>{escaped}</code></pre>"
with open("/tmp/tg_caption.txt", "w", encoding="utf-8") as f:
    f.write(formatted)
PYEOF

          CAPTION=$(cat /tmp/tg_caption.txt)
          echo "Caption generated (${#CAPTION} chars):"
          echo "$CAPTION"

          echo "[+] Uploading ${ZIP_NAME} to Telegram channel: ${TELEGRAM_CHAT_ID}..."
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${MODULE_ZIP};filename=${ZIP_NAME}" \
            --form-string "caption=${CAPTION}" \
            -F "parse_mode=HTML")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1 | cut -d: -f2)

          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ] && [ "$(echo "$HTTP_BODY" | jq -r '.ok // empty')" = "true" ]; then
            echo "🎉 Successfully uploaded ${ZIP_NAME} to ${TELEGRAM_CHAT_ID}!"
          else
            ERROR_DESC=$(echo "$HTTP_BODY" | jq -r '.description // "Unknown error"')
            echo "::error title=Telegram Upload Failed::Telegram API error: ${ERROR_DESC} (HTTP ${HTTP_STATUS})"
            echo "Please ensure your bot is an Administrator in ${TELEGRAM_CHAT_ID} with permission to post messages."
            exit 1
          fi
